{% extends 'award/base.html' %}

{% block content %}
<section class="py-5" style="background-color: var(--bg-gray); min-height: 70vh; display: flex; align-items: center;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-7" data-aos="zoom-in">
                <div class="bg-white shadow p-5 text-center" style="border-top: 5px solid var(--gold);">
                    <div style="width: 90px; height: 90px; margin: 0 auto 25px; border-radius: 50%; background: rgba(197,160,89,0.15); display: flex; align-items: center; justify-content: center;">
                        <i class="fas fa-check" style="font-size: 2.6rem; color: var(--gold);"></i>
                    </div>
                    <h2 style="color: var(--primary); font-weight: 900;">{{ success_content.main_title }}</h2>
                    <p class="mt-3 mb-4" style="color: #555; line-height: 2; font-size: 1.05rem;">{{ success_content.sub_text|linebreaksbr }}</p>
                    <a href="{% url 'home' %}" class="btn btn-gold px-5">{{ success_content.btn_text }} <i class="fas fa-home ms-2"></i></a>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}

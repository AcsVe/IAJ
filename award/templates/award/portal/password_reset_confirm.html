{% extends 'award/portal/_auth_base.html' %}
{% block card %}
{% if validlink %}
<h1>اختيار كلمة مرور جديدة</h1>
<form method="post" novalidate>{% csrf_token %}
  {% for f in form %}{% include 'award/portal/_field.html' %}{% endfor %}
  <button class="pt-btn pt-btn-gold pt-btn-block">حفظ كلمة المرور</button>
</form>
{% else %}
<div class="text-center"><i class="fas fa-link-slash" style="font-size:3rem;color:#e8710a"></i>
<h1 class="mt-3">الرابط غير صالح</h1><p class="pt-sub">انتهت صلاحيته أو استُخدم من قبل.</p>
<a class="pt-btn pt-btn-gold" href="{% url 'password_reset' %}">طلب رابط جديد</a></div>
{% endif %}
{% endblock %}

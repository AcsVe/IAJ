{% extends 'award/portal/_auth_base.html' %}
{% block card %}
<h1>إعادة إرسال رابط التفعيل</h1>
{% if sent %}<div class="pt-alert pt-alert-success">إذا كان البريد مسجّلاً وغير مفعّل فستصله رسالة خلال دقائق.</div>{% endif %}
<form method="post">{% csrf_token %}
  <div class="mb-3"><label class="form-label">البريد الإلكتروني</label><input type="email" name="email" class="form-control" dir="ltr" required></div>
  <button class="pt-btn pt-btn-gold pt-btn-block">إرسال</button>
</form>
<div class="pt-links"><a href="{% url 'login' %}">تسجيل الدخول</a></div>
{% endblock %}

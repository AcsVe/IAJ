<style>
.pt-page{min-height:calc(100vh - 120px);padding:38px 0 70px;
  background:radial-gradient(80% 60% at 85% 0%,rgba(197,160,89,.16) 0%,transparent 60%),radial-gradient(70% 60% at 0% 100%,rgba(10,22,50,.08) 0%,transparent 60%),var(--bg-gray)}
.pt-wrap{max-width:1100px}
.pt-narrow{max-width:560px;margin:0 auto}
.pt-card{background:#fff;border-radius:16px;box-shadow:0 10px 34px rgba(10,22,50,.08);padding:28px 30px;border-top:4px solid var(--gold);margin-bottom:22px}
.pt-card h1,.pt-card h2{color:var(--primary);font-weight:900}
.pt-card h1{font-size:1.9rem;margin-bottom:6px}
.pt-card h2{font-size:1.35rem;margin-bottom:14px}
.pt-sub{color:#667;font-size:1.05rem}
.pt-card .form-label{font-weight:800;color:var(--primary);margin-bottom:6px}
.pt-card .form-control,.pt-card .form-select{font-size:1.08rem;padding:12px 14px;border-radius:10px;border:1px solid rgba(10,22,50,.16)}
.pt-card .form-control:focus,.pt-card .form-select:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(197,160,89,.2)}
.pt-card .helptext,.pt-help{color:#778;font-size:.92rem;margin-top:5px;display:block}
.pt-err{color:#c62828;font-weight:700;font-size:.95rem;margin-top:5px}
.pt-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:12px 22px;font-weight:800;font-size:1.05rem;text-decoration:none;cursor:pointer;transition:.2s}
.pt-btn-gold{background:var(--gold);color:var(--primary)}.pt-btn-gold:hover{filter:brightness(1.07);color:var(--primary)}
.pt-btn-navy{background:var(--primary);color:#fff}.pt-btn-navy:hover{color:#fff;opacity:.9}
.pt-btn-light{background:#eef0f4;color:var(--primary)}.pt-btn-light:hover{background:#e3e6ec;color:var(--primary)}
.pt-btn-danger{background:#fdecec;color:#c62828}.pt-btn-danger:hover{background:#f9d7d7;color:#c62828}
.pt-btn-block{width:100%}
.pt-links{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-top:16px;font-size:.98rem}
.pt-links a{color:var(--primary);font-weight:700}
.pt-alert{border-radius:10px;padding:12px 16px;margin-bottom:16px;font-weight:600}
.pt-alert-success{background:#e7f6ec;color:#1e6b3a}.pt-alert-info{background:#e8f0fe;color:#1a4fa0}
.pt-alert-warning{background:#fff4e5;color:#8a4b00}.pt-alert-error,.pt-alert-danger{background:#fdecec;color:#a52020}
.pt-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
.pt-tabs a,.pt-tabs button{padding:9px 16px;border-radius:30px;background:#fff;color:var(--primary);font-weight:800;text-decoration:none;border:1px solid rgba(10,22,50,.1);font-size:.98rem}
.pt-tabs a.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.pt-tabs .badge{background:#d93025;color:#fff;border-radius:20px;padding:2px 7px;font-size:.75rem;margin-right:4px}
.pt-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.pt-stat{background:#fff;border-radius:14px;padding:16px;text-align:center;box-shadow:0 6px 20px rgba(10,22,50,.06)}
.pt-stat b{display:block;font-size:1.9rem;color:var(--primary);font-weight:900}
.pt-stat span{color:#778;font-weight:700}
.pt-status{display:inline-block;padding:4px 12px;border-radius:20px;color:#fff;font-weight:800;font-size:.88rem;white-space:nowrap}
.st-draft{background:#9aa0a6}.st-submitted{background:#1a73e8}.st-screening{background:#7b61ff}.st-revision{background:#e8710a}
.st-judging{background:#9c27b0}.st-accepted{background:#188038}.st-rejected{background:#d93025}.st-winner{background:#c5a059}.st-withdrawn{background:#5f6368}
.pt-list{list-style:none;padding:0;margin:0}
.pt-item{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 4px;border-bottom:1px solid #eef0f4;flex-wrap:wrap}
.pt-item:last-child{border-bottom:0}
.pt-item .t{font-weight:900;color:var(--primary);font-size:1.12rem;text-decoration:none}
.pt-item .m{color:#778;font-size:.92rem;margin-top:3px}
.pt-cycle{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;background:linear-gradient(135deg,var(--primary),#1b2c55);color:#fff;border-radius:16px;padding:22px 26px;margin-bottom:22px}
.pt-cycle b{color:var(--gold);font-size:1.3rem}
.pt-steps{display:flex;gap:0;margin:8px 0 22px;counter-reset:s}
.pt-step{flex:1;text-align:center;position:relative;color:#99a;font-weight:800;font-size:.95rem}
.pt-step::before{counter-increment:s;content:counter(s);display:flex;align-items:center;justify-content:center;width:38px;height:38px;margin:0 auto 6px;border-radius:50%;background:#e6e8ee;color:#99a;font-weight:900;position:relative;z-index:1}
.pt-step::after{content:'';position:absolute;top:19px;right:50%;width:100%;height:3px;background:#e6e8ee;z-index:0}
.pt-step:first-child::after{display:none}
.pt-step.done{color:var(--primary)}.pt-step.done::before{background:var(--primary);color:#fff;content:'✓'}
.pt-step.done::after,.pt-step.current::after{background:var(--primary)}
.pt-step.current{color:var(--primary)}.pt-step.current::before{background:var(--gold);color:var(--primary);box-shadow:0 0 0 5px rgba(197,160,89,.25)}
.pt-step.warn::before{background:#e8710a;color:#fff;content:'!'}
.pt-kv{display:grid;grid-template-columns:170px 1fr;gap:10px 18px}
.pt-kv dt{color:#778;font-weight:700}.pt-kv dd{margin:0;color:#223;font-weight:600;white-space:pre-line}
.pt-note{background:#fff8e6;border-right:4px solid var(--gold);border-radius:8px;padding:14px 16px;white-space:pre-line;margin-bottom:16px}
.pt-note.warn{background:#fff1e6;border-color:#e8710a}
.pt-timeline{list-style:none;padding:0;margin:0;border-right:3px solid #e6e8ee}
.pt-timeline li{position:relative;padding:4px 18px 14px 0}
.pt-timeline li::before{content:'';position:absolute;right:-8px;top:8px;width:13px;height:13px;border-radius:50%;background:var(--gold);border:2px solid #fff}
.pt-timeline small{color:#889}
.pt-notes a.pt-n{display:block;padding:14px 12px;border-bottom:1px solid #eef0f4;text-decoration:none;color:#223;border-radius:8px}
.pt-notes a.pt-n.unread{background:#f5f8ff;border-right:4px solid var(--gold)}
.pt-notes a.pt-n b{color:var(--primary)}
.pt-notes a.pt-n p{margin:4px 0 0;color:#667;white-space:pre-line;font-size:.95rem}
.pt-crit{border:1px solid #eef0f4;border-radius:12px;padding:14px 16px;margin-bottom:12px}
.pt-crit .row{align-items:center}
.pt-score{max-width:120px;font-size:1.25rem !important;font-weight:900;text-align:center}
.pt-total{font-size:2.2rem;font-weight:900;color:var(--primary)}
.pt-empty{text-align:center;color:#889;padding:30px 10px}
.pt-empty i{font-size:2.4rem;color:var(--gold);display:block;margin-bottom:10px}
.pt-pw{position:relative}.pt-pw button{position:absolute;left:8px;top:50%;transform:translateY(-50%);border:0;background:none;color:#889}
.hp{position:absolute!important;left:-9999px!important;height:0;overflow:hidden}
@media(max-width:767px){.pt-card{padding:20px 16px}.pt-kv{grid-template-columns:1fr}.pt-kv dt{margin-top:6px}.pt-step{font-size:.78rem}.pt-step::before{width:30px;height:30px}.pt-step::after{top:15px}.pt-card h1{font-size:1.5rem}}
</style>
<script>document.addEventListener('DOMContentLoaded',function(){document.querySelectorAll('.pt-card input:not([type=checkbox]):not([type=hidden]):not([type=radio]):not([class]),.pt-card select:not([class]),.pt-card textarea:not([class])').forEach(function(i){i.classList.add(i.tagName==='SELECT'?'form-select':'form-control')});document.querySelectorAll('.pt-err').forEach(function(e){var i=e.parentElement.querySelector('input,select,textarea');if(i)i.classList.add('is-invalid')})});</script>

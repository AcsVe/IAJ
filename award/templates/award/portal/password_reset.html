{% extends 'award/portal/_auth_base.html' %}
{% block card %}
<h1><i class="fas fa-key ms-2" style="color:var(--gold)"></i> نسيت كلمة المرور</h1>
<p class="pt-sub">اكتبوا بريد الحساب وسنرسل رابطاً لاختيار كلمة مرور جديدة.</p>
<form method="post" novalidate>{% csrf_token %}
  {% with f=form.email %}{% include 'award/portal/_field.html' %}{% endwith %}
  <button class="pt-btn pt-btn-gold pt-btn-block">إرسال الرابط</button>
</form>
<div class="pt-links"><a href="{% url 'login' %}">العودة لتسجيل الدخول</a></div>
{% endblock %}

<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"></head>
<body style="margin:0;background:#f3f4f7;font-family:Tahoma,Arial,sans-serif;direction:rtl">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f3f4f7;padding:24px 10px"><tr><td align="center">
<table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;background:#ffffff;border-radius:12px;overflow:hidden">
  <tr><td style="background:#0a1632;padding:22px 26px;color:#c5a059;font-size:20px;font-weight:bold;text-align:right">جائزة انتصار عباس جردانة</td></tr>
  <tr><td style="height:4px;background:#c5a059"></td></tr>
  <tr><td style="padding:28px 26px;text-align:right;color:#1f2433">
    <h1 style="margin:0 0 16px;font-size:20px;color:#0a1632">{{ subject }}</h1>
    <div style="font-size:15px;line-height:1.9">{{ body|linebreaksbr }}</div>
    {% if url %}<p style="margin:26px 0 8px"><a href="{{ url }}" style="display:inline-block;background:#c5a059;color:#0a1632;text-decoration:none;font-weight:bold;padding:12px 26px;border-radius:8px">{{ button }}</a></p>
    <p style="font-size:12px;color:#888;word-break:break-all;direction:ltr;text-align:left">{{ url }}</p>{% endif %}
  </td></tr>
  <tr><td style="padding:16px 26px;background:#f8f9fb;color:#888;font-size:12px;text-align:right">
    هذه رسالة آلية من <a href="{{ site_url }}" style="color:#0a1632">موقع الجائزة</a> — لا تردّوا عليها.
  </td></tr>
</table></td></tr></table>
</body></html>

<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>body,td,h1,p,a{font-family:'Cairo',Tahoma,'Segoe UI',Arial,sans-serif}</style></head>
<body style="margin:0;background:#f3f4f7;font-family:'Cairo',Tahoma,'Segoe UI',Arial,sans-serif;direction:rtl">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f3f4f7;padding:24px 10px"><tr><td align="center">
<table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;background:#ffffff;border-radius:14px;overflow:hidden">
  <tr><td bgcolor="{{ brand.menu }}" style="background-color:{{ brand.menu }};background-image:radial-gradient(90% 140% at 100% 0%,rgba(255,255,255,.22) 0%,rgba(255,255,255,0) 55%),linear-gradient(125deg,{{ brand.menu_light }} 0%,{{ brand.menu }} 45%,{{ brand.menu_dark }} 82%,rgba({{ brand.gold_rgb }},.75) 100%);padding:22px 26px;text-align:right;border-bottom:1px solid rgba(255,255,255,.25)" dir="rtl">
    <table role="presentation" cellpadding="0" cellspacing="0"><tr>
      {% if has_logo %}<td style="padding-left:14px;vertical-align:middle"><img src="cid:iajlogo" width="62" height="62" alt="شعار الجائزة" style="display:block;width:62px;height:62px;border-radius:50%;border:2px solid {{ brand.gold }};background:#fff"></td>{% endif %}
      <td style="vertical-align:middle;font-family:'Cairo',Tahoma,Arial,sans-serif">
        <div style="color:{{ brand.gold }};font-size:21px;font-weight:900;line-height:1.4;text-shadow:0 1px 2px rgba(0,0,0,.35)">جائزة انتصار عباس جردانة</div>
        <div style="color:#eef3ee;font-size:13px;opacity:.9">للثقافة والتعليم</div>
      </td></tr></table>
  </td></tr>
  <tr><td style="height:4px;background:{{ brand.gold }};line-height:4px;font-size:0">&nbsp;</td></tr>
  <tr><td style="padding:28px 26px;text-align:right;color:#1f2433;font-family:'Cairo',Tahoma,Arial,sans-serif" dir="rtl">
    <h1 style="margin:0 0 16px;font-size:21px;color:{{ brand.menu_dark }};font-weight:900">{{ subject }}</h1>
    <div style="font-size:16px;line-height:1.95">{{ body|linebreaksbr }}</div>
    {% if url %}<p style="margin:26px 0 8px"><a href="{{ url }}" style="display:inline-block;background-color:{{ brand.menu }};background-image:linear-gradient(125deg,{{ brand.menu_light }} 0%,{{ brand.menu }} 50%,{{ brand.menu_dark }} 100%);color:#ffffff;text-decoration:none;font-weight:900;font-size:16px;padding:12px 30px;border-radius:10px;border:1px solid rgba({{ brand.gold_rgb }},.7);box-shadow:0 6px 16px rgba({{ brand.menu_rgb }},.35)">{{ button }}</a></p>
    <p style="font-size:12px;color:#888;word-break:break-all;direction:ltr;text-align:left">{{ url }}</p>{% endif %}
  </td></tr>
  <tr><td style="padding:16px 26px;background:#f8f9fb;color:#888;font-size:12px;text-align:right;font-family:'Cairo',Tahoma,Arial,sans-serif" dir="rtl">
    رسالة آلية من <a href="{{ site_url }}" style="color:{{ brand.menu }};font-weight:700">موقع جائزة انتصار عباس جردانة</a>
  </td></tr>
</table></td></tr></table>
</body></html>
